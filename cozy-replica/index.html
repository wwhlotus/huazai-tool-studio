/* Cozy World data-loader (inlined) */
/* Cozy World 数据驱动加载器
 * 从资料库数据表拉取：房间定义 / 角色×房间内容 / 创作资产 / 用户存档
 * 无宿主 SDK 或拉取失败时返回空对象，bundle 侧用内置样本兜底。
 * 存档：角色与工作台状态写回资料库 saves 表，跨设备同步；localStorage 作为本地兜底。
 */
(function () {
  var CFG = {
    rooms: "HBdxn4moBYAfJvTSGIlmEI",
    contents: "rlnTzShBHVur5yKBn630Sy",
    assets: "CpszbU40W2we5PDakq6jcg",
    saves: "ljT4GEY2qpInJ7lmaceu4Q"
  };
  var USER_KEY = "default";           // 存档用户标识（多用户扩展预留）
  var CH_KEY = "cozy-world:character";
  var WS_KEY = "cozy-world:workspace";
  var CP_KEY = "cozy-world-content-progress";

  // 离线快照：把个人资料库 4 张表导出为 cozy-snapshot.json，本地/无宿主环境直接读它，无需 cloud SDK。
  var SNAP = null;
  function loadSnap() {
    if (SNAP !== null) return Promise.resolve(SNAP);
    if (window.__COZY_SNAP__) { SNAP = window.__COZY_SNAP__; return Promise.resolve(SNAP); }
    if (typeof fetch !== "function") { SNAP = {}; return Promise.resolve(SNAP); }
    return fetch("./cozy-snapshot.json").then(function (r) { return r.json(); }).then(function (d) {
      SNAP = d || {}; window.__COZY_SNAP__ = SNAP; return SNAP;
    }).catch(function () { SNAP = {}; return SNAP; });
  }
  function localDb(snap) {
    function rows(id) { return (snap && snap[id]) || []; }
    return {
      query: function (opt) { return Promise.resolve({ results: rows(opt && opt.databaseId) }); },
      addRecord: function () { return Promise.resolve({}); },
      updateRecord: function () { return Promise.resolve({}); },
      deleteRecord: function () { return Promise.resolve({}); }
    };
  }
  function dbApi() {
    var sp = window.__SMART_PAGE__;
    if (sp && sp.database) return sp.database;
    if (window.dbApi) { try { return window.dbApi(); } catch (e) {} }
    if (SNAP) return localDb(SNAP);
    return null;
  }
  // 平台托管环境（资料库域名）或离线快照就绪时，才认为可读取数据。
  function isHosted() {
    if (window.__SMART_PAGE__) return true;
    if (SNAP) return true;
    var h = (window.location && window.location.host) || "";
    return /workbuddy|codebuddy/i.test(h);
  }
  function waitDb(attempt) {
    return new Promise(function (res, rej) {
      var db = dbApi();
      if (db && db.query) return res(db);
      if (SNAP) return res(localDb(SNAP));
      if (!isHosted()) {
        // 离线环境：异步加载本地快照，加载完成后再解析；失败则走样本兜底。
        loadSnap().then(function (s) {
          if (s && Object.keys(s).length) res(localDb(s));
          else rej(new Error("no-snapshot"));
        }).catch(function () { rej(new Error("no-snapshot")); });
        return;
      }
      if (attempt >= 40) return rej(new Error("db-not-ready"));
      setTimeout(function () { waitDb(attempt + 1).then(res, rej); }, 150);
    });
  }
  function q(db, id) {
    return db.query({ databaseId: id, pageSize: 100 }).then(function (r) {
      return (r && r.results) || [];
    });
  }
  function str(v) {
    if (v == null) return "";
    if (typeof v === "string") return v;
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    if (Array.isArray(v)) return v.map(str).join(",");
    if (typeof v === "object") {
      if (v.text != null) return str(v.text);
      if (v.select != null) return str(v.select);
      if (v.multi_select != null) return str(v.multi_select);
      if (v.url != null) return str(v.url);
      if (v.date != null) return str(v.date);
      var keys = Object.keys(v);
      for (var i = 0; i < keys.length; i++) {
        var s = str(v[keys[i]]);
        if (s) return s;
      }
    }
    return "";
  }
  function splitLines(s) {
    return s ? s.split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean) : [];
  }
  function parseHighlights(s) {
    return s ? s.split(/\n+/).map(function (line) {
      var i = line.indexOf("=");
      if (i > 0) return { label: line.slice(0, i).trim(), value: line.slice(i + 1).trim() };
      return { label: line.trim(), value: "" };
    }).filter(function (h) { return h.label; }) : [];
  }

  // 创作资产 → skills 房间动态内容（分类统计 + 最新条目）
  function mergeAssets(rooms, assetsRec) {
    if (!rooms || !assetsRec || !assetsRec.length) return rooms;
    var catCount = {}, names = [];
    assetsRec.forEach(function (a) {
      var cat = str(a["分类"]) || "素材";
      var nm = str(a["名称"]);
      catCount[cat] = (catCount[cat] || 0) + 1;
      if (nm) names.push(nm);
    });
    var cats = Object.keys(catCount);
    var latest = names.slice(-4).reverse();
    return rooms.map(function (room) {
      if (!room || room.id !== "skills" || !cats.length) return room;
      return {
        id: "skills",
        title: "创作资产库",
        eyebrow: "资产库 · 素材索引",
        metric: cats.length + " 类",
        summary: "分类收藏",
        accent: room.accent || "#9a72b7",
        paragraphs: ["封面模板、配乐、字体、素材按分类整理。条目在资料库资产表中维护，这里展示分类概览与最新收藏。"],
        bullets: latest.map(function (n) { return "最新 · " + n; }),
        highlights: cats.map(function (c) { return { label: c, value: catCount[c] + " 条" }; })
      };
    });
  }

  function applySave(save) {
    try {
      // “角色”保存 3D 形象；“职业预设”保存 creator/maker/designer/student/life，二者不再互相覆盖。
      var character = str(save["角色"]);
      var preset = str(save["职业预设"]) || "creator";
      var roleText = str(save["角色文本"]);
      var name = str(save["昵称"]);
      var roomState = str(save["房间状态"]);
      var progress = str(save["内容进度"]);
      if (character && !localStorage.getItem(CH_KEY)) localStorage.setItem(CH_KEY, character);
      if ((roleText || name || roomState || preset) && !localStorage.getItem(WS_KEY)) {
        var ws = { ready: true, name: name || "", role: preset, roleText: roleText || "", zones: null };
        if (roomState) { try { var z = JSON.parse(roomState); if (Array.isArray(z)) ws.zones = z; } catch (e) {} }
        localStorage.setItem(WS_KEY, JSON.stringify(ws));
      }
      if (progress) {
        try {
          var cp = JSON.parse(progress);
          var old = JSON.parse(localStorage.getItem(CP_KEY) || "{}");
          localStorage.setItem(CP_KEY, JSON.stringify(Object.assign({}, cp, old)));
        } catch (e) {}
      }
    } catch (e) {}
  }

  function build() {
    return waitDb(0).then(function (db) {
      return Promise.all([q(db, CFG.rooms), q(db, CFG.contents), q(db, CFG.assets), q(db, CFG.saves)]);
    }).then(function (rs) {
      var roomsRec = rs[0], contentsRec = rs[1], assetsRec = rs[2], savesRec = rs[3];
      var rooms = null, contents = null;
      if (roomsRec.length) {
        rooms = roomsRec.map(function (r) {
          return {
            id: str(r["房间id"]),
            title: str(r["标题"]),
            eyebrow: str(r["眉题"]),
            metric: str(r["指标"]),
            summary: str(r["摘要"]),
            accent: str(r["强调色"]) || "#9a72b7",
            paragraphs: splitLines(str(r["段落"])),
            highlights: parseHighlights(str(r["要点"])),
            bullets: splitLines(str(r["子弹点"]))
          };
        }).filter(function (r) { return r.id; });
        rooms = mergeAssets(rooms, assetsRec);
      }
      if (contentsRec.length) {
        contents = {};
        contentsRec.forEach(function (r) {
          var role = str(r["角色"]), room = str(r["房间"]);
          if (!role || !room) return;
          contents[role] = contents[role] || {};
          contents[role][room] = {
            mood: str(r["心情"]),
            metric: str(r["指标"]),
            summary: str(r["摘要"]),
            paragraphs: splitLines(str(r["段落"])),
            highlights: parseHighlights(str(r["要点"])),
            bullets: splitLines(str(r["子弹点"]))
          };
        });
      }
      if (savesRec && savesRec.length) applySave(savesRec[0]);
      return { rooms: rooms, contents: contents };
    }).catch(function () {
      return {};
    });
  }

  var bootPromise = null;
  function boot() {
    if (!bootPromise) bootPromise = build();
    return bootPromise;
  }
  window.__COZY_BOOT__ = boot;

  // ---------- 存档写入（跨设备同步，失败静默降级 localStorage） ----------
  function upsertSave(properties) {
    var db = dbApi();
    if (!db || !db.query) return;
    db.query({ databaseId: CFG.saves, pageSize: 100 }).then(function (r) {
      var rows = (r && r.results) || [];
      var mine = null;
      for (var i = 0; i < rows.length; i++) {
        if (str(rows[i]["用户标识"]) === USER_KEY) { mine = rows[i]; break; }
      }
      if (mine && mine._id) {
        db.updateRecord({ databaseId: CFG.saves, recordId: mine._id, properties: properties }).catch(function () {});
      } else {
        db.addRecord({ databaseId: CFG.saves, properties: properties }).catch(function () {});
      }
    }).catch(function () {});
  }
  function saveCharacter(roleId) {
    try {
      upsertSave({ "用户标识": { text: USER_KEY }, "角色": { text: roleId || "" } });
    } catch (e) {}
  }
  function saveWorkspace(ws) {
    try {
      if (!ws) return;
      upsertSave({
        "用户标识": { text: USER_KEY },
        "职业预设": { select: ws.role || "creator" },
        "角色文本": { text: ws.roleText || "" },
        "昵称": { text: ws.name || "" },
        "房间状态": { text: Array.isArray(ws.zones) ? JSON.stringify(ws.zones) : "" }
      });
    } catch (e) {}
  }
  window.__COZY_SAVE__ = { character: saveCharacter, workspace: saveWorkspace };
})();

  function loadRecords(room) {

    if (!db || !db.query) { state.offline = true; state.loading[room] = false; renderAll(room); return; }
    db.query({ databaseId: model.db, pageSize: 100 }).then(function (r) {
      // 资料库 SDK 当前不承诺 select filter 的统一语义，前端基于职业字段做可靠过滤。

      var incoming = ((r && r.results) || []).map(function (row) { return parseRow(model, row); }).filter(function (row) { return row["职业预设"] === requestedRole; });
      var local = state.records[room] || [];

  function valuesToProps(model, values, isUpdate) {

      if (field.kind === "checkbox") { props[field.name] = { checkbox: !!value }; return; }
      if (field.kind === "number") {
        if (value !== "" && value != null && !Number.isNaN(Number(value))) props[field.name] = { number: Number(value) };
        return;

      if (field.kind === "date") {
        if (value) props[field.name] = { date: value };

      }
      if (field.kind === "select") {
        if (value) props[field.name] = { select: value };

      '<div class="wrt-workspace"><div class="wrt-list"></div><div class="wrt-create" hidden><div class="wrt-fields">' + formFields(model, null, "new-" + room) + '</div><div class="wrt-create-foot"><span class="wrt-state">读取中…</span><button type="button" class="wrt-add">保存</button></div></div></div>';

    state.activeRole = currentRole();
    addStyle(); attach();
    new MutationObserver(attach).observe(document.body, { childList: true, subtree: true });
