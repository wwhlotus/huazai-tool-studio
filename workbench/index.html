<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台</title>
<style>
  html,body{height:100%;margin:0}
  body{
    background:#080b12;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  /* 视频背景层：铺满视口，静音循环自动播放 */
  .bg-video{
    position:fixed;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:-2;pointer-events:none;
  }
  .stage{
    position:relative;z-index:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;
  }
  @media(max-width:560px){
    .stage{gap:24px}
  }

  /* From Uiverse.io by neerajbaniwal —— 去掉绝对定位，改由 .stage 统一居中布局 */
  .btn-shine {
    padding: 12px 48px;
    color: #fff;
    background: linear-gradient(to right, #9f9f9f 0, #fff 10%, #868686 20%);
    background-position: 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s infinite linear;
    animation-fill-mode: forwards;
    -webkit-text-size-adjust: none;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    white-space: nowrap;
    font-family: "Poppins", sans-serif;
  }

  /* 兼容不支持 background-clip:text 的环境：退回白字，至少可读 */
  @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
    .btn-shine { color: #fff; -webkit-text-fill-color: #fff; }
  }

  @-webkit-keyframes shine {
    0%   { background-position: 0; }
    60%  { background-position: 180px; }
    100% { background-position: 180px; }
  }
  @keyframes shine {
    0%   { background-position: 0; }
    60%  { background-position: 180px; }
    100% { background-position: 180px; }
  }
</style>
</head>
<body>
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="assets/home-bg.mp4" type="video/mp4">
  </video>

  <div class="stage">
    <a class="btn-shine" href="report-claims-h5.html">骑手</a>
    <a class="btn-shine" id="btnAed" href="#">AED</a>
  </div>

<script>
  // AED 线上地址：填上后，线上环境点 AED 会跳到这里；留空则线上自动隐藏该按钮
  var AED_PROD_URL = '';

  var isLocal = location.port === '3000' ||
    /^(127\.0\.0\.1|localhost|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname || '');

  var aed = document.getElementById('btnAed');
  if (isLocal) {
    // AED 工具跑在 8787，跟随当前访问主机名：本机访问走 127.0.0.1，局域网访问走局域网 IP
    aed.href = 'http://' + location.hostname + ':8787/';
  } else if (AED_PROD_URL) {
    aed.href = AED_PROD_URL;
  } else {
    aed.style.display = 'none';
  }

  // 部分浏览器会拦截自动播放，静音状态下显式再触发一次
  var bgv = document.getElementById('bgVideo');
  if (bgv) {
    // 0.5 倍速：defaultPlaybackRate 与 playbackRate 都要设，load 完再补一次防被重置
    bgv.defaultPlaybackRate = 0.5;
    bgv.playbackRate = 0.5;
    bgv.addEventListener('loadedmetadata', function () { bgv.playbackRate = 0.5; });
    var pr = bgv.play(); if (pr && pr.catch) pr.catch(function () {});
  }
</script>
</body>
</html>
